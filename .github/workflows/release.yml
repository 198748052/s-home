name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        working-directory: server
        run: go vet ./... && go test ./...

      - name: Build linux binaries
        working-directory: server
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "building linux/$arch ($VERSION)"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/tianqi-config-linux-$arch" .
          done
          cd dist
          sha256sum tianqi-config-linux-amd64 tianqi-config-linux-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/tianqi-config-linux-amd64
            server/dist/tianqi-config-linux-arm64
            server/dist/SHA256SUMS.txt
          generate_release_notes: true
