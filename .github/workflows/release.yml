name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        working-directory: server
        run: go vet ./... && go test ./...

      - name: Build linux binaries
        working-directory: server
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "building linux/$arch ($VERSION)"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/tianqi-config-linux-$arch" .
          done
          cd dist
          sha256sum tianqi-config-linux-amd64 tianqi-config-linux-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test app
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Package APK
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist-apk/s-home-${GITHUB_REF_NAME}.apk"
          cd dist-apk
          sha256sum "s-home-${GITHUB_REF_NAME}.apk" > SHA256SUMS-apk.txt
          cat SHA256SUMS-apk.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/tianqi-config-linux-amd64
            server/dist/tianqi-config-linux-arm64
            server/dist/SHA256SUMS.txt
            dist-apk/s-home-${{ github.ref_name }}.apk
            dist-apk/SHA256SUMS-apk.txt
          generate_release_notes: true
